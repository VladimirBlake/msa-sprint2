stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service

build:
  stage: build
  script: 
    - docker build -f booking-service/Dockerfile -t booking-service booking-service 


test:
  stage: test
  script:
    - docker run --name booking-service-test -p 8080:8080 -e ENABLE_FEATURE_X=true -d booking-service 
    - curl http://localhost:8080/ping
    - docker stop booking-service-test
    - docker rm booking-service-test


deploy:
  stage: deploy
  script:
    - minikube image load $IMAGE_NAME:$IMAGE_TAG
    - helm upgrade -f helm/booking-service/values.stage.yaml booking-service helm/booking-service
tag:
  stage: tag
  script:
  - git tag "v$(date +'%Y%m%d%H%M%S')"